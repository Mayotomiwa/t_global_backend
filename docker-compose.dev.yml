version: '3.9'

services:
  api:
    build:
      context: .
      target: builder
    container_name: nestjs_api_dev
    ports:
      - '3000:3000'
      - '9229:9229'        # Node debugger port
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@db:5432/nestdb
    volumes:
      - .:/app                 # Mount source code for hot reload
      - /app/node_modules      # Keep node_modules inside container
      - ./logs:/app/logs       # Persist Winston log files locally
    command: pnpm run start:dev
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: nestjs_db_dev
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestdb
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data_dev:

