services:
  - type: web
    name: nestjs-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tglobal-db
          property: connectionString

databases:
  - name: tglobal-db
    databaseName: tglobal_db
    user: postgres
    plan: free