services:
  - type: web
    name: nestjs-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nestjs-db
          property: connectionString

databases:
  - name: nestjs-db
    databaseName: nestdb
    user: postgres
    plan: free